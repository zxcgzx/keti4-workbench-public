services:
  - type: web
    name: keti4-workbench-public
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PUBLIC_DEMO
        value: "0"
      - key: SNAPSHOT_DIR
        value: data/snapshots
      - key: WORKBENCH_RUNS_DIR
        value: /tmp/workbench-runs
